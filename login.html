<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Daftar - AsistenLapak AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            z-index: 10;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 32px;
            text-decoration: none;
        }

        .auth-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            margin-bottom: 32px;
        }

        .auth-form {
            text-align: left;
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-control::placeholder {
            color: #94A3B8;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .auth-toggle {
            margin-top: 24px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .auth-toggle a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .auth-toggle a:hover {
            text-decoration: underline;
        }

        .back-link {
            position: absolute;
            top: 32px;
            left: 32px;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            transition: color 0.3s ease;
            z-index: 20;
        }

        .back-link:hover {
            color: var(--primary);
        }

        .free-trial-badge {
            display: inline-block;
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>
    <div class="glow-bg glow-1"></div>
    <div class="glow-bg glow-2"></div>

    <a href="index.html" class="back-link"><i class="ph ph-arrow-left"></i> Kembali ke Beranda</a>

    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="auth-logo">
                <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M16 2C8.26801 2 2 7.8203 2 15C2 18.9959 3.99349 22.5647 7.08639 24.8711C6.73295 26.6579 5.51862 28.5135 3.39953 29.5663C3.17646 29.6772 3.06497 29.9328 3.1491 30.1634C3.23322 30.394 3.46824 30.5 3.70889 30.5C7.94052 30.5 11.2319 28.3243 12.8717 26.5452C13.8821 26.8385 14.928 27 16 27C23.732 27 30 21.1797 30 14C30 6.8203 23.732 2 16 2Z"
                        fill="url(#grad2)" />
                    <circle cx="16" cy="14" r="3" fill="#0F172A" />
                    <circle cx="10" cy="14" r="2" fill="#0F172A" />
                    <circle cx="22" cy="14" r="2" fill="#0F172A" />
                    <line x1="12" y1="14" x2="14" y2="14" stroke="#0F172A" stroke-width="1.5" />
                    <line x1="18" y1="14" x2="20" y2="14" stroke="#0F172A" stroke-width="1.5" />
                    <defs>
                        <linearGradient id="grad2" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#8B5CF6" />
                            <stop offset="1" stop-color="#06B6D4" />
                        </linearGradient>
                    </defs>
                </svg>
                <span>AsistenLapak <strong>AI</strong></span>
            </a>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form active">
                <h2 class="auth-title">Daftar Akun Baru</h2>
                <p class="auth-subtitle">Mulai otomatisasi chat toko Anda sekarang.</p>

                <div class="form-group">
                    <label>Nama Toko</label>
                    <input type="text" id="registerName" class="form-control" placeholder="Contoh: Toko Anda">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="registerEmail" class="form-control" placeholder="Contoh: tokoanda@email.com">
                </div>
                <div class="form-group">
                    <label>Nomor WhatsApp</label>
                    <input type="tel" id="registerWa" class="form-control" placeholder="Contoh: 081234567890">
                </div>
                <div class="form-group">
                    <label>Kata Sandi</label>
                    <input type="password" class="form-control" placeholder="Minimal 8 karakter">
                </div>

                <button type="submit" class="btn btn-primary full-width" style="margin-top: 8px;">Daftar & Klaim
                    Trial</button>

                <div class="auth-toggle">
                    Sudah punya akun? <a onclick="toggleAuth('login')">Masuk di sini</a>
                </div>
            </form>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <h2 class="auth-title">Selamat Datang Kembali</h2>
                <p class="auth-subtitle">Masuk untuk mengelola AsistenLapak AI Anda.</p>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="Contoh: tokoanda@email.com">
                </div>
                <div class="form-group">
                    <label>Kata Sandi</label>
                    <input type="password" class="form-control" placeholder="Masukkan kata sandi">
                </div>

                <button type="submit" class="btn btn-primary full-width" style="margin-top: 8px;">Masuk ke
                    Dashboard</button>

                <div class="auth-toggle">
                    Belum punya akun? <a onclick="toggleAuth('register')">Daftar sekarang</a>
                </div>
            </form>

        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    
    <script src="login.js"></script>
</body>

</html>
